<main class="page">
  <header class="page-header">
    <div>
      <h1>New role</h1>
      <p>Define a permission group.</p>
    </div>
  </header>
  <form class="form-card stack" [formGroup]="roleForm" (ngSubmit)="onSave()">
    <div class="field">
      <label for="name">Role name</label><input id="name" formControlName="name" placeholder="e.g. Support agent" /><span
        class="error"
      ></span>
    </div>
    <div class="field"><label for="description">Description</label><textarea id="description" rows="4" formControlName="description"></textarea></div>
    <div>
      <button class="btn btn-primary" type="submit">Save role</button>
      <a class="btn btn-secondary" href="/roles">Cancel</a>
    </div>
  </form>
</main>
