<main class="page">
  <header class="page-header">
    <div>
      <h1>New role</h1>
      <p>Define a permission group.</p>
    </div>
  </header>
  <form class="form-card stack">
    <div class="field">
      <label>Role name</label><input required placeholder="e.g. Support agent" /><span
        class="error"
      ></span>
    </div>
    <div class="field"><label>Description</label><textarea rows="4"></textarea></div>
    <div>
      <button class="btn btn-primary">Save role</button>
      <a class="btn btn-secondary" href="/roles">Cancel</a>
    </div>
  </form>
</main>
