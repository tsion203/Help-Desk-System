<main class="page"><header class="page-header"><div><h1>{{ pageTitle }}</h1><p>Configure how support requests are classified.</p></div></header><form class="form-card stack" [formGroup]="categoryForm" (ngSubmit)="onSave()"><div class="field"><label for="categoryName">Name</label><input id="categoryName" formControlName="name" /></div><div class="field"><label for="categoryDescription">Description</label><textarea id="categoryDescription" rows="5" formControlName="description"></textarea></div><div><button class="btn btn-primary" type="submit">Save category</button><a class="btn btn-secondary" routerLink="/categories">Cancel</a></div></form></main>
