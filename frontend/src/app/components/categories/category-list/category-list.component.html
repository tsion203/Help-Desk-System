<main class="page"><header class="page-header"><div><h1>Categories</h1><p>Manage help desk request categories.</p></div><a class="btn btn-primary" routerLink="/categories/new">Add category</a></header><section class="table-card"><table><thead><tr><th>Name</th><th>Description</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let category of categories | globalSearch: globalSearch.term()" [routerLink]="['/categories', category.id, 'edit']" class="clickable-row"><td>{{ category.name }}</td><td>{{ category.description }}</td><td><span class="delete-action" role="button" tabindex="0" (click)="deleteCategory(category.id, $event)" (keydown.enter)="deleteCategory(category.id, $event)">Delete</span></td></tr></tbody></table><p *ngIf="loading">Loading categories...</p><p *ngIf="!loading && (categories | globalSearch: globalSearch.term()).length === 0">No categories found.</p><app-pagination [page]="page" [pageSize]="pageSize" [totalElements]="totalElements" [totalPages]="totalPages" (pageChange)="changePage($event)" /></section></main>
