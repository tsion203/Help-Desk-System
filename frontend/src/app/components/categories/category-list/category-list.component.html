<main class="page">
  <header class="page-header">
    <div><h1>Categories</h1><p>Manage help desk request categories.</p></div>
    <a class="btn btn-primary" routerLink="/categories/new">Add category</a>
  </header>
  <section class="table-card">
    <table>
      <thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let category of categories | globalSearch: globalSearch.term()">
          <td>{{ category.name }}</td><td>{{ category.description }}</td><td>{{ category.active ? 'Active' : 'Inactive' }}</td>
          <td><div class="table-actions"><button *ngIf="canUpdate" class="icon-action edit-action" type="button" title="Update category" aria-label="Update category" [routerLink]="['/categories', category.id, 'edit']">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4M4 20l4-1"/></svg>
            </button><button *ngIf="canChangeStatus" class="icon-action delete-action" type="button" [title]="category.active ? 'Deactivate category' : 'Reactivate category'" (click)="changeStatus(category, $event)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M9 9l-2 2a5 5 0 1 0 10 0l-2-2"/></svg>
            </button></div></td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="loading">Loading categories...</p>
    <p *ngIf="!loading && (categories | globalSearch: globalSearch.term()).length === 0">No categories found.</p>
    <app-pagination [page]="page" [pageSize]="pageSize" [totalElements]="totalElements" [totalPages]="totalPages" (pageChange)="changePage($event)"></app-pagination>
  </section>
</main>
