<main class="page"><header class="page-header"><div><h1>Update ticket</h1><p *ngIf="ticketNumber">{{ ticketNumber }} · {{ ticketSubject }}</p></div></header>
  <form class="form-card stack" [formGroup]="ticketForm" (ngSubmit)="onUpdate()"><div class="field"><label>Subject</label><input formControlName="subject" /></div><div class="grid grid-2">
    <div class="field"><label>Status</label><select formControlName="status"><option value="OPEN">Open</option><option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option><option value="CLOSED">Closed</option></select></div>
    <div class="field"><label>Priority</label><select formControlName="priority"><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select></div>
    <div class="field"><label>Category</label><select formControlName="categoryId"><option [ngValue]="0">Select category</option><option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option></select><span class="error" *ngIf="ticketForm.controls.categoryId.touched && ticketForm.controls.categoryId.invalid">Please select a ticket category.</span></div>
    <div class="field" *ngIf="canAssign"><label>Assignee</label><select formControlName="assignedToId"><option [ngValue]="0">Unassigned</option><option *ngFor="let user of assignees" [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }}</option></select></div></div>
    <div class="field"><label>Description</label><textarea rows="6" formControlName="description"></textarea></div><button class="btn btn-primary" type="submit">Save changes</button></form></main>
