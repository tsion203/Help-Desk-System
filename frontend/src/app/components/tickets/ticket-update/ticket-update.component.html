<main class="page">
  <header class="page-header">
    <div>
      <h1>Update ticket</h1>
      <p>HD-1042 · Unable to access VPN</p>
    </div>
  </header>
  <form class="form-card stack">
    <div class="grid grid-2">
      <div class="field">
        <label>Status</label
        ><select>
          <option>In progress</option>
          <option>Resolved</option>
          <option>Closed</option>
        </select>
      </div>
      <div class="field">
        <label>Priority</label
        ><select>
          <option>High</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label
        ><select>
          <option>Network access</option>
        </select>
      </div>
      <div class="field">
        <label>Assignee</label
        ><select>
          <option>Jordan Davis</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Resolution update</label
      ><textarea rows="6" placeholder="Add an internal or customer-facing update"></textarea>
    </div>
    <label class="dropzone">Drop a supporting file here or browse</label>
    <div>
      <button class="btn btn-primary">Save changes</button>
      <a class="btn btn-secondary" href="/tickets/1042">Cancel</a>
    </div>
  </form>
</main>
