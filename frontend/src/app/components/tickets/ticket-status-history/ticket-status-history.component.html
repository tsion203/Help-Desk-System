<section class="page"><h2>Ticket Status History</h2><p *ngIf="loading">Loading status history...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <div class="timeline-item" *ngFor="let item of statusHistory"><strong>{{ item.oldStatus || 'Created' }} → {{ item.newStatus }}</strong><p>Changed by {{ item.changedByName }}</p><small>{{ item.changedAt }}</small></div>
  <p *ngIf="!loading && !errorMessage && statusHistory.length === 0">No status history found.</p></section>
