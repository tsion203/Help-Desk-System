<main class="page">
  <header class="page-header">
    <div>
      <h1>Create ticket</h1>
      <p>Provide enough detail for the support team to help quickly.</p>
    </div>
  </header>
  <form class="form-card stack" [formGroup]="ticketForm" (ngSubmit)="onCreate()">
    <div class="grid grid-2">
      <div class="field">
        <label for="subject">Subject</label
        ><input id="subject" formControlName="subject" placeholder="Briefly describe the issue" /><span
          class="error"
        ></span>
      </div>
      <div class="field">
        <label for="category">Category</label
        ><select id="category" formControlName="categoryId">
          <option [ngValue]="0">Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option>
        </select>
      </div>
      <div class="field">
        <label for="priority">Priority</label
        ><select id="priority" formControlName="priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
      <div class="field">
        <label for="assignee">Assignee</label
        ><select id="assignee" formControlName="assignedToId">
          <option [ngValue]="0">Unassigned</option>
          <option *ngFor="let user of users" [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }}</option>
        </select>
      </div>
      <div class="field">
        <label for="createdBy">Created by</label><select id="createdBy" formControlName="createdById"><option [ngValue]="0">Select requester</option><option *ngFor="let user of users" [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }}</option></select>
      </div>
      <div class="field">
        <label for="status">Status</label><select id="status" formControlName="status"><option value="OPEN">Open</option></select>
      </div>
    </div>
    <div class="field">
      <label for="description">Description</label
      ><textarea
        id="description"
        formControlName="description"
        rows="7"
        placeholder="Explain what happened, what you expected, and any error messages."
      ></textarea
      ><span class="error"></span>
    </div>
    <div>
      <button class="btn btn-primary" type="submit">Create ticket</button>
      <a class="btn btn-secondary" href="/tickets">Cancel</a>
    </div>
  </form>
</main>
