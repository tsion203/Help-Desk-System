<main class="page">
  <header class="page-header">
    <div>
      <h1>Create ticket</h1>
      <p>Provide enough detail for the support team to help quickly.</p>
    </div>
  </header>
  <form class="form-card stack" [formGroup]="ticketForm" (ngSubmit)="onCreate()">
    <div class="grid grid-2">
      <div class="field">
        <label for="subject">Subject</label
        ><input id="subject" formControlName="subject" placeholder="Briefly describe the issue" />
      </div>
      <div class="field">
        <label for="category">Category</label
        ><select id="category" formControlName="categoryId">
          <option [ngValue]="0">Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id" [disabled]="!category.active">{{ category.name }}{{ category.active ? '' : ' (Inactive)' }}</option>
        </select>
        <span class="error" *ngIf="ticketForm.controls.categoryId.touched && ticketForm.controls.categoryId.invalid">Please select a ticket category.</span>
      </div>
      <div class="field">
        <label for="priority">Priority</label
        ><select id="priority" formControlName="priority">
          <option value="LOW">Low</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
          <option value="CRITICAL">Critical</option>
        </select>
      </div>
      <div class="field" *ngIf="isAdmin">
        <label for="assignee">Assignee</label
        ><select id="assignee" formControlName="assignedToId">
          <option [ngValue]="0">Unassigned</option>
          <option *ngFor="let user of users" [ngValue]="user.id" [disabled]="!user.active">{{ user.firstName }} {{ user.lastName }}{{ user.active ? '' : ' (Inactive)' }}</option>
        </select>
      </div>
      <div class="field">
        <label for="createdBy">Created by</label><input id="createdBy" [value]="requesterEmail" readonly aria-readonly="true" />
      </div>
      <div class="field">
        <label for="status">Status</label><select id="status" formControlName="status"><option value="OPEN">Open</option></select>
      </div>
    </div>
    <div class="field">
      <label for="description">Description</label
      ><textarea
        id="description"
        formControlName="description"
        rows="7"
        placeholder="Explain what happened, what you expected, and any error messages."
      ></textarea
      ><span class="error" *ngIf="ticketForm.controls.description.touched && ticketForm.controls.description.invalid">Description is required.</span>
    </div>
    <div>
      <button class="btn btn-primary" type="submit">Create ticket</button>
      <a class="btn btn-secondary" href="/tickets">Cancel</a>
    </div>
  </form>
</main>
