<section class="page"><h2>Ticket Attachments</h2><p *ngIf="loading">Loading attachments...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <article class="card" *ngFor="let attachment of attachments"><strong>{{ attachment.fileName }}</strong><p>{{ attachment.fileSize }} bytes</p><small>Uploaded by {{ attachment.uploadedByName }} on {{ attachment.uploadedAt }}</small></article>
  <p *ngIf="!loading && !errorMessage && attachments.length === 0">No attachments found.</p></section>
