<section class="page"><h2>Ticket Comments</h2><p *ngIf="loading">Loading comments...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <article class="card" *ngFor="let comment of comments"><strong>{{ comment.userName }}</strong><p>{{ comment.comment }}</p><small>{{ comment.commentedAt }}</small><span class="delete-action" role="button" tabindex="0" (click)="deleteComment(comment.id)" (keydown.enter)="deleteComment(comment.id)">Delete</span></article>
  <p *ngIf="!loading && !errorMessage && comments.length === 0">No comments found.</p></section>
