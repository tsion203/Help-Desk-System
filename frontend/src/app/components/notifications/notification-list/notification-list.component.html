<section class="page"><h2>Notifications <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span></h2><p *ngIf="loading">Loading notifications...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <article class="card" *ngFor="let notification of notifications" [class.unread]="!notification.isRead"><strong>{{ notification.title }}</strong><p>{{ notification.message }}</p><small>{{ notification.createdAt }}<span *ngIf="notification.ticketNumber"> · {{ notification.ticketNumber }}</span></small><button *ngIf="!notification.isRead" type="button" (click)="markAsRead(notification.id)">Mark as read</button></article>
  <p *ngIf="!loading && !errorMessage && notifications.length === 0">No notifications found.</p></section>
