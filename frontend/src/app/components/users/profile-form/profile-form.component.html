<main class="page"><header class="page-header"><div><h1>My profile</h1><p>Update your personal information and password.</p></div></header><p *ngIf="loading">Loading profile...</p><form *ngIf="!loading" class="form-card stack" [formGroup]="profileForm" (ngSubmit)="onSave()"><div class="grid grid-2"><div class="field"><label>First name</label><input formControlName="firstName" /></div><div class="field"><label>Last name</label><input formControlName="lastName" /></div><div class="field"><label>Email</label><input type="email" formControlName="email" /></div><div class="field"><label>Phone number</label><input type="tel" formControlName="phoneNumber" /></div><div class="field"><label>Current password</label><input type="password" formControlName="currentPassword" autocomplete="current-password" placeholder="Required when changing password" /></div><div class="field"><label>New password</label><input type="password" formControlName="password" minlength="8" autocomplete="new-password" placeholder="Leave blank to keep current password" /></div></div><button class="btn btn-primary" type="submit">Save profile</button></form></main>
