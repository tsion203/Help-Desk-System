<main class="page">
  <header class="page-header"><div><h1>Departments</h1><p>Manage service teams and ownership.</p></div><a class="btn btn-primary" routerLink="/departments/new">Add department</a></header>
  <section class="table-card">
    <table><thead><tr><th>Name</th><th>Description</th><th>Availability</th><th>Actions</th></tr></thead>
      <tbody><tr *ngFor="let department of departments | globalSearch: globalSearch.term()"><td>{{ department.name }}</td><td>{{ department.description }}</td><td><span class="badge">{{ department.active ? 'Active' : 'Inactive' }}</span></td><td><div class="table-actions"><button *ngIf="canUpdate" class="icon-action edit-action" type="button" title="Update department" aria-label="Update department" [routerLink]="['/departments', department.id, 'edit']">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4M4 20l4-1"/></svg>
            </button><button *ngIf="canChangeStatus" class="icon-action delete-action" type="button" [title]="department.active ? 'Deactivate department' : 'Reactivate department'" (click)="changeStatus(department, $event)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M9 9l-2 2a5 5 0 1 0 10 0l-2-2"/></svg>
            </button></div></td></tr></tbody>
    </table>
    <p *ngIf="loading">Loading departments...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p *ngIf="!loading && !errorMessage && (departments | globalSearch: globalSearch.term()).length === 0">No departments found.</p><app-pagination [page]="page" [pageSize]="pageSize" [totalElements]="totalElements" [totalPages]="totalPages" (pageChange)="changePage($event)"></app-pagination>
  </section>
</main>
