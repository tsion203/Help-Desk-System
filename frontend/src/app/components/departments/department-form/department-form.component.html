<main class="page">
  <header class="page-header">
    <div>
      <h1>{{ pageTitle }}</h1>
      <p>Create an organizational support group.</p>
    </div>
  </header>
  <form class="form-card stack" [formGroup]="departmentForm" (ngSubmit)="onSave()">
    <div class="field">
        <label for="name">Name</label><input id="name" formControlName="name" placeholder="e.g. Information Technology" /><span
          class="error"
        ></span>
    </div>
    <div class="field"><label for="description">Description</label><textarea id="description" rows="5" formControlName="description"></textarea></div>
    <div>
      <button class="btn btn-primary" type="submit">Save department</button>
      <a class="btn btn-secondary" href="/departments">Cancel</a>
    </div>
  </form>
</main>
