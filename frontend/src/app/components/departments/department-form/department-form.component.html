<main class="page">
  <header class="page-header">
    <div>
      <h1>New department</h1>
      <p>Create an organizational support group.</p>
    </div>
  </header>
  <form class="form-card stack">
    <div class="grid grid-2">
      <div class="field">
        <label>Name</label><input required placeholder="e.g. Information Technology" /><span
          class="error"
        ></span>
      </div>
      <div class="field">
        <label>Manager</label
        ><select>
          <option>Select manager</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Description</label><textarea rows="5"></textarea></div>
    <div>
      <button class="btn btn-primary">Save department</button>
      <a class="btn btn-secondary" href="/departments">Cancel</a>
    </div>
  </form>
</main>
