<main class="auth-card" aria-labelledby="reset-title">
  <header class="auth-head"><h1 id="reset-title">Reset password</h1></header>
  <form class="auth-body stack" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" formControlName="newPassword" autocomplete="new-password" />
      <span class="error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('required')">New password is required.</span>
      <span class="error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')">Password must contain at least 8 characters.</span>
    </div>
    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <span class="error" *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('required')">Confirm your new password.</span>
    </div>
    <p class="error message" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p class="success" role="status" *ngIf="successMessage">{{ successMessage }} Redirecting to sign in...</p>
    <div class="auth-actions">
      <button class="btn btn-primary" type="submit" [disabled]="submitting || !!successMessage">{{ submitting ? 'Resetting...' : 'Reset password' }}</button>
      <a class="btn btn-secondary" routerLink="/login">Back to sign in</a>
    </div>
  </form>
</main>
