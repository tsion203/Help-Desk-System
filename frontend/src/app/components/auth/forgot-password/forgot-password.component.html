<main class="auth-card" aria-labelledby="forgot-title">
  <header class="auth-head"><h1 id="forgot-title">Forgot password</h1></header>
  <form class="auth-body stack" [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="muted">Enter your work email and we will send you a password reset link.</p>
    <div class="field">
      <label for="forgot-email">Work email</label>
      <input id="forgot-email" type="email" formControlName="email" autocomplete="email" placeholder="name@company.com" />
      <span class="error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">Email is required.</span>
      <span class="error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">Enter a valid email address.</span>
    </div>
    <p class="success" role="status" *ngIf="successMessage">{{ successMessage }}</p>
    <div class="auth-actions">
      <button class="btn btn-primary" type="submit" [disabled]="submitting">{{ submitting ? 'Sending...' : 'Send reset link' }}</button>
      <a class="btn btn-secondary" routerLink="/login">Back to sign in</a>
    </div>
  </form>
</main>
