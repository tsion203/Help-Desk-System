<main class="auth-card" aria-labelledby="login-title">
  <header class="auth-head">
    <app-brand-logo />
    <div><p>HELP DESK SYSTEM</p><h1 id="login-title">Welcome back</h1></div>
  </header>
  <form class="auth-body stack" [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <div class="field">
      <label for="email">Work email</label
      ><input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="name@company.com"
        required
      /><span class="error" aria-live="polite"></span>
    </div>
    <div class="field">
      <label for="password">Password</label
      ><input
        id="password"
        formControlName="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      /><span class="error" aria-live="polite"></span>
    </div>
    <div class="auth-actions">
      <button class="btn btn-primary" type="submit">Sign in</button>
      <a class="btn btn-secondary" routerLink="/register">Create account</a>
    </div>
    <a class="muted" routerLink="/forgot-password">Forgot your password?</a>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</main>
