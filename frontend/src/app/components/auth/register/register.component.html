<main class="auth-card" aria-labelledby="register-title">
  <header class="auth-head">
    <app-brand-logo />
    <div><p>HELP DESK SYSTEM</p><h1 id="register-title">Create account</h1></div>
  </header>
  <form class="auth-body" [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <div class="form-grid">
      <div class="field full"><label for="email">Work email</label><input id="email" type="email" formControlName="email" placeholder="name@company.com" /></div>
      <div class="field full"><label for="password">Password</label><input id="password" type="password" formControlName="password" placeholder="Create a password" /></div>
      <div class="field"><label for="firstName">First name</label><input id="firstName" formControlName="firstName" /></div>
      <div class="field"><label for="lastName">Last name</label><input id="lastName" formControlName="lastName" /></div>
      <div class="field"><label for="employeeId">Employee ID</label><input id="employeeId" formControlName="employeeId" /></div>
      <div class="field"><label for="phoneNumber">Phone number</label><input id="phoneNumber" type="tel" formControlName="phoneNumber" /></div>
      <div class="field full"><label for="departmentId">Department</label><select id="departmentId" formControlName="departmentId"><option [ngValue]="0">Select department</option><option *ngFor="let department of departments" [ngValue]="department.id" [disabled]="!department.active">{{ department.name }}{{ department.active ? '' : ' (Inactive)' }}</option></select></div>
    </div>
    <div class="auth-actions"><button class="btn btn-primary" type="submit">Create account</button><a class="btn btn-secondary" routerLink="/login">Back to sign in</a></div>
  </form>
</main>
