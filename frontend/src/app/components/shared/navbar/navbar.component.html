<header class="navbar">
  <form *ngIf="search.enabled()" class="nav-search" [formGroup]="searchForm" role="search"><label><input type="search" formControlName="search" [placeholder]="search.placeholder()" [attr.aria-label]="search.placeholder()" autocomplete="off" /></label></form>
  <div class="nav-actions">
    <a *ngIf="isEmployee" class="btn btn-secondary" routerLink="/profile">Profile</a>
    <a *ngIf="!isEmployee" class="icon-button" routerLink="/notifications" aria-label="Notifications">Notifications <span class="badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span></a>
    <button class="avatar" aria-label="Open profile menu" *ngIf="userInitials">{{ userInitials }}</button>
  </div>
</header>
