<main class="page"><header class="page-header"><div><h1>Admin dashboard</h1><p>System activity and support performance at a glance.</p></div></header>
  <p *ngIf="loading">Loading dashboard...</p><p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <section class="grid grid-4" *ngIf="!loading && !errorMessage"><article class="metric" *ngFor="let metric of metrics"><small>{{ metric.label }}</small><strong>{{ metric.value }}</strong><span class="muted">{{ metric.detail }}</span></article></section>
  <section class="card" *ngIf="isAdmin"><h2>Restricted management hub</h2><p class="muted">Administrator access only</p></section>
</main>
